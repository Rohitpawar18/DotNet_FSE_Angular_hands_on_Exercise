<div class="course-list-container">
  <h2>Available Courses</h2>
  <p class="subtitle">Browse and enroll in courses offered this semester.</p>

  <!-- ============ COURSES GRID WITH DATA BINDING ============ -->
  <div class="courses-grid">
    <app-course-card
      *ngFor="let c of courses"
      [course]="c"
      (enrollRequested)="onEnroll($event)"
    ></app-course-card>
  </div>

  <div class="selection-info" *ngIf="selectedCourseId">
    <p class="info-message">
      ✅ <strong>Selected Course ID:</strong> {{ selectedCourseId }}
      <span class="course-name">
        ({{ (courses | slice: selectedCourseId - 1 : selectedCourseId)[0]?.name }})
      </span>
    </p>
  </div>

  <div class="no-selection" *ngIf="!selectedCourseId">
    <p>👆 Click "Enroll Now" on any course to select it</p>
  </div>
</div>
